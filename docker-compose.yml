services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: "../SnippetVault API"
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Database=SnippetVault;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__SecretKey: ${JWT_SECRET}
      JwtSettings__Issuer: SnippetVault
      JwtSettings__Audience: SnippetVault
      JwtSettings__ExpirationInMinutes: "60"
      AllowedOrigins__0: http://localhost
      AllowedOrigins__1: http://localhost:80
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_logs:/app/Logs

  client:
    build:
      context: "../SnippetVault-Client/client"
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqlserver_data:
  api_logs: